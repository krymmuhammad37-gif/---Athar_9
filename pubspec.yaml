class _QuranPageState extends State<QuranPage> {
  int _current = 1;
  bool _playing = false;

  static const List<String> _names = [
    'Al-Fatiha','Al-Baqarah','Al-Imran','An-Nisa','Al-Maidah','Al-Anam','Al-Araf','Al-Anfal','At-Tawbah','Yunus',
    'Hud','Yusuf','Ar-Rad','Ibrahim','Al-Hijr','An-Nahl','Al-Isra','Al-Kahf','Maryam','Ta-Ha',
    'Al-Anbiya','Al-Hajj','Al-Muminun','An-Nur','Al-Furqan','Ash-Shuara','An-Naml','Al-Qasas','Al-Ankabut','Ar-Rum',
    'Luqman','As-Sajdah','Al-Ahzab','Saba','Fatir','Ya-Sin','As-Saffat','Sad','Az-Zumar','Ghafir',
    'Fussilat','Ash-Shura','Az-Zukhruf','Ad-Dukhan','Al-Jathiyah','Al-Ahqaf','Muhammad','Al-Fath','Al-Hujurat','Qaf',
    'Adh-Dhariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahman','Al-Waqiah','Al-Hadid','Al-Mujadila','Al-Hashr','Al-Mumtahanah',
    'As-Saff','Al-Jumuah','Al-Munafiqun','At-Taghabun','At-Talaq','At-Tahrim','Al-Mulk','Al-Qalam','Al-Haqqah','Al-Maarij',
    'Nuh','Al-Jinn','Al-Muzzammil','Al-Muddathir','Al-Qiyamah','Al-Insan','Al-Mursalat','An-Naba','An-Naziat','Abasa',
    'At-Takwir','Al-Infitar','Al-Mutaffifin','Al-Inshiqaq','Al-Buruj','At-Tariq','Al-Ala','Al-Ghashiyah','Al-Fajr','Al-Balad',
    'Ash-Shams','Al-Layl','Ad-Duha','Ash-Sharh','At-Tin','Al-Alaq','Al-Qadr','Al-Bayyinah','Az-Zalzalah','Al-Adiyat',
    'Al-Qariah','At-Takathur','Al-Asr','Al-Humazah','Al-Fil','Quraysh','Al-Maun','Al-Kawthar','Al-Kafirun','An-Nasr',
    'Al-Masad','Al-Ikhlas','Al-Falaq','An-Nas'
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Quran'), backgroundColor: const Color(0xFF161B22)),
      body: Column(
        children: [
          Container(
            padding: const EdgeInsets.all(16),
            color: const Color(0xFF161B22),
            child: Row(
              children: [
                Expanded(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text('Surah ${_names[_current - 1]}', style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                      Text(_playing ? 'Playing...' : 'Stopped', style: TextStyle(color: _playing ? Colors.greenAccent : Colors.white54, fontSize: 12)),
                    ],
                  ),
                ),
                IconButton(icon: const Icon(Icons.skip_previous, color: Colors.white), onPressed: _current > 1 ? () => _play(_current - 1) : null),
                IconButton(
                  iconSize: 44,
                  icon: Icon(_playing ? Icons.pause_circle_filled : Icons.play_circle_filled, color: _playing ? Colors.greenAccent : Colors.white),
                  onPressed: () {
                    if (_playing) { QuranAudio.pause(); } else { QuranAudio.resume(); }
                    setState(() => _playing = !_playing);
                  },
                ),
                IconButton(icon: const Icon(Icons.skip_next, color: Colors.white), onPressed: _current < 114 ? () => _play(_current + 1) : null),
              ],
            ),
          ),
          Expanded(
            child: ListView.builder(
              itemCount: _names.length,
              itemBuilder: (_, i) {
                final n = i + 1;
                final active = _current == n;
                return ListTile(
                  leading: CircleAvatar(
                    backgroundColor: active ? const Color(0xFF1F6FEB) : const Color(0xFF30363D),
                    child: Text('$n', style: const TextStyle(color: Colors.white, fontSize: 12)),
                  ),
                  title: Text('Surah ${_names[i]}', style: TextStyle(color: Colors.white, fontWeight: active ? FontWeight.bold : FontWeight.normal)),
                  trailing: Icon(active && _playing ? Icons.volume_up : Icons.play_circle_fill, color: active && _playing ? Colors.greenAccent : Colors.white54),
                  onTap: () => _play(n),
                );
              },
            ),
          ),
        ],
      ),
    );
  }

  void _play(int n) {
    QuranAudio.playSurah(n);
    setState(() { _current = n; _playing = true; });
  }
}

class PrayerPage extends StatefulWidget {
  const PrayerPage({super.key});
  @override
  State<PrayerPage> createState() => _PrayerPageState();
}

class _PrayerPageState extends State<PrayerPage> {
  String _status = 'Getting location...';
  Map<String, String> _times = {};

  @override
  void initState() { super.initState(); _load(); }

  Future<void> _load() async {
    try {
      LocationPermission p = await Geolocator.checkPermission();
      if (p == LocationPermission.denied) p = await Geolocator.requestPermission();
      if (p == LocationPermission.deniedForever) { setState(() => _status = 'Permission denied'); return; }
      final pos = await Geolocator.getCurrentPosition();
      final coords = Coordinates(pos.latitude, pos.longitude);
      final params = CalculationMethod.egyptian.getParameters();
      params.madhab = Madhab.shafi;
      final pt = PrayerTimes.today(coords, params);

      String fmt(DateTime d) {
        final h = d.hour;
        final m = d.minute.toString().padLeft(2, '0');
        final period = h >= 12 ? 'PM' : 'AM';
        final hh = h > 12 ? h - 12 : (h == 0 ? 12 : h);
        return '${hh.toString().padLeft(2, '0')}:$m $period';
      }

      setState(() {
        _status = 'Location: ${pos.latitude.toStringAsFixed(2)}, ${pos.longitude.toStringAsFixed(2)}';
        _times = {
          'Fajr': fmt(pt.fajr), 'Sunrise': fmt(pt.sunrise), 'Dhuhr': fmt(pt.dhuhr),
          'Asr': fmt(pt.asr), 'Maghrib': fmt(pt.maghrib), 'Isha': fmt(pt.isha),
        };
      });
    } catch (e) { setState(() => _status = 'Error: $e'); }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text('Prayer Times'), backgroundColor: const Color(0xFF161B22)),
      body: Padding(
        padding: const EdgeInsets.all(16),
        child: Column(
          children: [
            Container(
              width: double.infinity,
              padding: const EdgeInsets.all(14),
              decoration: BoxDecoration(color: const Color(0xFF161B22), borderRadius: BorderRadius.circular(14), border: Border.all(color: const Color(0xFF30363D))),
              child: Text(_status, style: const TextStyle(color: Colors.greenAccent, fontSize: 12)),
            ),
            const SizedBox(height: 16),
            if (_times.isEmpty) const CircularProgressIndicator()
            else Expanded(
              child: ListView(
                children: _times.entries.map((e) => Card(
                  color: const Color(0xFF161B22),
                  margin: const EdgeInsets.symmetric(vertical: 4),
                  child: ListTile(
                    title: Text(e.key, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    trailing: Text(e.value, style: const TextStyle(color: Colors.amberAccent, fontWeight: FontWeight.bold, fontSize: 16)),
                  ),
                )).toList(),
              ),
            ),
          ],
        ),
      ),
    );
  }
}

class SebhaPage extends StatefulWidget {
  const SebhaPage({super.key});
  @override
  State<SebhaPage> createState() => _SebhaPageState();
}

class _SebhaPageState extends State<SebhaPage> {
  int _count = 0;
  int _cycle = 0;
  static const List<String> _azkar = ['Subhan Allah', 'Alhamdulillah', 'Allahu Akbar', 'La ilaha illa Allah'];

  void _inc() {
    HapticFeedback.lightImpact();
    setState(() { _count++; if (_count % 33 == 0) _cycle = (_cycle + 1) % _azkar.length; });
  }

  void _reset() {
    HapticFeedback.mediumImpact();
    setState(() { _count = 0; _cycle = 0; });
  }

  @override
  Widget build(BuildContext context) {
    final progress = (_count % 33) / 33;
    return Scaffold(
      appBar: AppBar(title: const Text('Tasbih'), backgroundColor: const Color(0xFF161B22)),
      body: Center(
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Text(_azkar[_cycle], style: const TextStyle(fontSize: 26, fontWeight: FontWeight.bold, color: Colors.amberAccent)),
            const SizedBox(height: 30),
            GestureDetector(
              onTap: _inc,
              child: Stack(
                alignment: Alignment.center,
                children: [
                  SizedBox(width: 200, height: 200, child: CircularProgressIndicator(value: progress, strokeWidth: 6, backgroundColor: const Color(0xFF30363D), valueColor: const AlwaysStoppedAnimation(Color(0xFF9E6A03)))),
                  Container(
                    width: 170, height: 170,
                    decoration: const BoxDecoration(shape: BoxShape.circle, color: Color(0xFF161B22)),
                    child: Center(child: Text('$_count', style: const TextStyle(fontSize: 48, fontWeight: FontWeight.bold, color: Colors.white))),
                  ),
                ],
              ),
            ),
            const SizedBox(height: 40),
            Row(
              mainAxisAlignment: MainAxisAlignment.center,
              children: [
                ElevatedButton.icon(onPressed: _inc, icon: const Icon(Icons.add), label: const Text('Count'), style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF238636), foregroundColor: Colors.white)),
                const SizedBox(width: 16),
                ElevatedButton.icon(onPressed: _reset, icon: const Icon(Icons.refresh), label: const Text('Reset'), style: ElevatedButton.styleFrom(backgroundColor: Colors.red.shade800, foregroundColor: Colors.white)),
              ],
            ),
          ],
        ),
      ),
    );
  }
}

